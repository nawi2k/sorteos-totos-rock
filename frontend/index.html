<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteos - Totos Rock</title>
  
  <link rel="icon" type="image/png" href="assets/logo-totos.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="rock-bg"></div>

  <header class="header">
    <div class="logo-container">
      <img src="assets/logo-totos.png" alt="Totos Rock Logo" class="logo">
    </div>
    <h1>TOTOS ROCK</h1>
    <p class="subtitle">Sorteos Oficiales de Instagram</p>
  </header>

  <main class="container">
    <section class="card glow-card">
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="cambiarTab('link')">🔗 Por Enlace</button>
        <button class="tab-btn" onclick="cambiarTab('manual')">📝 Carga Manual</button>
      </div>

      <!-- Tab 1: Enlace -->
      <div id="tabLink" class="tab-content">
        <label for="postUrl" class="input-label">Pegá el enlace de la publicación o reel:</label>
        <input type="text" id="postUrl" placeholder="https://www.instagram.com/p/...">
        <button id="btnCargar" onclick="cargarParticipantes()" class="btn-rock">
          🎸 CARGAR PARTICIPANTES
        </button>
      </div>

      <!-- Tab 2: Manual -->
      <div id="tabManual" class="tab-content hidden">
        <label for="textoManual" class="input-label">Pegá la lista de usuarios o comentarios:</label>
        <textarea id="textoManual" rows="6" placeholder="Pegá acá los comentarios o nombres de usuario (ej: @juan, @maria)..."></textarea>
        <button onclick="procesarManual()" class="btn-rock">
          🔥 PROCESAR LISTA
        </button>
      </div>
    </section>

    <!-- Resultados -->
    <section id="resultadoSection" class="card glow-card hidden">
      <div class="counter-box">
        <span class="counter-label">Participantes Únicos</span>
        <span id="totalCount" class="counter-number">0</span>
      </div>

      <button id="btnSortear" class="btn-rock btn-gold" onclick="realizarSorteo()">
        🔥 ¡REALIZAR SORTEO! 🔥
      </button>

      <div id="ruletaBox" class="ruleta-box hidden">
        <div id="ruletaNombre" class="ruleta-nombre">@cargando...</div>
      </div>

      <div id="ganadorBox" class="ganador-box hidden">
        <div class="ganador-header">🎉 ¡GANADOR/A! 🎉</div>
        <div id="nombreGanador" class="ganador-nombre">@usuario</div>
        <p class="ganador-footer">Totos Rock Drugstore 🤘</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
