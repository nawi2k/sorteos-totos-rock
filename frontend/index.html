<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteos - Totos Rock</title>
  <link rel="icon" type="image/png" href="assets/logo-totos.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="rock-bg"></div>

  <header class="header">
    <div class="logo-container">
      <img src="assets/logo-totos.png" alt="Totos Rock Logo" class="logo">
    </div>
    <h1>TOTOS ROCK</h1>
    <p class="subtitle">Sorteos Oficiales de Instagram</p>
  </header>

  <main class="container">
    <section class="card glow-card">
      <label for="postUrl" class="input-label">Pegá el enlace de la publicación o reel:</label>
      <input type="text" id="postUrl" placeholder="https://www.instagram.com/p/...">
      
      <button id="btnCargar" onclick="cargarParticipantes()" class="btn-rock">
        🎸 CARGAR PARTICIPANTES
      </button>
    </section>

    <section id="resultadoSection" class="card glow-card hidden">
      <div class="counter-box">
        <span class="counter-label">Comentarios en la publicación</span>
        <span id="totalCount" class="counter-number">0</span>
      </div>

      <button id="btnSortear" class="btn-rock btn-gold" onclick="abrirModalSorteo()">
        🔥 ¡REALIZAR SORTEO! 🔥
      </button>
    </section>
  </main>

  <!-- CUADRADITO FLOTANTE -->
  <div id="modalSorteo" class="modal-overlay hidden">
    <div class="modal-card card glow-card">
      <button class="modal-close-btn" onclick="cerrarModalSorteo()">✕</button>

      <!-- Ruleta Girando -->
      <div id="ruletaBox" class="ruleta-box hidden">
        <p class="ruleta-status">🔥 REALIZANDO SORTEO... 🔥</p>
        <div id="ruletaNombre" class="ruleta-nombre">@cargando...</div>
      </div>

      <!-- Cuadro Ganador -->
      <div id="ganadorBox" class="ganador-box hidden">
        <div class="ganador-header">🎉 ¡GANADOR/A! 🎉</div>
        <div class="foto-ganador-container">
          <img id="fotoGanador" src="assets/logo-totos.png" alt="Ganador" class="foto-ganador">
        </div>
        <div id="nombreGanador" class="ganador-nombre">@usuario</div>
        <p class="ganador-footer">Totos Rock Drugstore 🤘</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
